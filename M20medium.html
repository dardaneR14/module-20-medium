
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Online Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        /* Header */
        header {
            background-color: #222;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        nav a:hover {
            color: orange;
        }

        .search input {
            padding: 9px;
            border: none;
            border-radius: 5px;
        }

        /* Hero Section */
        .hero {
            height: 350px;
            background: linear-gradient(
                rgba(0,0,0,0.4),
                rgba(0,0,0,0.4)
            ), url("https://images.unsplash.com/photo-1441986300917-64674bd600d8")
            center/cover;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .hero p {
            margin-bottom: 20px;
        }

        .hero button {
            padding: 12px 25px;
            background: orange;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Products */
        .products {
            padding: 40px 7%;
            text-align: center;
        }

        .products h2 {
            margin-bottom: 30px;
            font-size: 30px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .product {
            background: white;
            padding-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .product img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product h3 {
            margin: 15px 0 8px;
        }

        .product p {
            color: #666;
            margin-bottom: 12px;
        }

        .product button {
            background: #222;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }

        .product button:hover {
            background: orange;
            color: black;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
        }

        .modal-content button {
            margin-top: 15px;
            padding: 8px 20px;
            background: orange;
            border: none;
            cursor: pointer;
        }

        /* Footer */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .product-grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">MyStore</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
        </nav>

        <div class="search">
            <input type="text" id="searchInput"
                   placeholder="Search products..."
                   oninput="searchProducts()">
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <h1>Welcome to MyStore</h1>
        <p>Discover amazing products at great prices!</p>
        <button onclick="location.href='#products'">
            Shop Now
        </button>
    </section>

    <!-- Product Section -->
    <section class="products" id="products">

        <h2>Our Products</h2>

        <div class="product-grid">

            <div class="product">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"
                     alt="Red sports shoes">
                <h3>Sports Shoes</h3>
                <p>$50.00</p>
                <button onclick="addToCart()">Add to Cart</button>
                <button onclick="showDetails('Sports Shoes', 'Comfortable shoes for everyday use.', '$50.00')">
                    Details
                </button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"
                     alt="Wrist watch">
                <h3>Smart Watch</h3>
                <p>$80.00</p>
                <button onclick="addToCart()">Add to Cart</button>
                <button onclick="showDetails('Smart Watch', 'A stylish watch for your everyday activities.', '$80.00')">
                    Details
                </button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
                     alt="Headphones">
                <h3>Headphones</h3>
                <p>$40.00</p>
                <button onclick="addToCart()">Add to Cart</button>
                <button onclick="showDetails('Headphones', 'High-quality headphones with clear sound.', '$40.00')">
                    Details
                </button>
            </div>

        </div>
    </section>

    <!-- Product Details Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <h2 id="modalName"></h2>
            <p id="modalDescription"></p>
            <h3 id="modalPrice"></h3>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

    <!-- Footer -->
    <footer id="contact">
        <p>Contact us: info@mystore.com</p>
        <p>&copy; 2026 MyStore. All Rights Reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script>
        let cartCount = 0;

        function addToCart() {
            cartCount++;
            alert("Product added to cart! Total items: " + cartCount);
        }

        function showDetails(name, description, price) {
            document.getElementById("modalName").innerText = name;
            document.getElementById("modalDescription").innerText = description;
            document.getElementById("modalPrice").innerText = price;

            document.getElementById("productModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("productModal").style.display = "none";
        }

        function searchProducts() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let products = document.querySelectorAll(".product");

            products.forEach(function(product) {
                let name = product.querySelector("h3").innerText.toLowerCase();

                if (name.includes(input)) {
                    product.style.display = "block";
                } else {
                    product.style.display = "none";
                }
            });
        }
    </script>

</body>
</html>
